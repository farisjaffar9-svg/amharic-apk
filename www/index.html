<title>تعلّم الأمهرية · Learn Amharic</title>
<meta name="theme-color" content="#1d7a4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="አማርኛ">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf7f2;--card:#fff;--tx:#1f2a24;--mut:#6b7a70;--ac:#1d7a4d;--ac2:#e8f4ec;--bd:#e3ddd2;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1e2723;--tx:#eef3ef;--mut:#9fb0a5;--ac:#4cc58a;--ac2:#22352b;--bd:#2f3d36;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1e2723;--tx:#eef3ef;--mut:#9fb0a5;--ac:#4cc58a;--ac2:#22352b;--bd:#2f3d36;--bad:#ff7b6b}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:640px;margin-inline:auto;padding:12px 14px 96px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
h1{font-size:1.15rem;margin:6px 0 10px;text-align:center}
.tabs{display:flex;gap:6px;position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:var(--card);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}button{touch-action:manipulation}
.tabs button{flex:1;padding:12px 4px;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:.9rem}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.note{background:var(--ac2);border-radius:10px;padding:8px 10px;font-size:.8rem;color:var(--mut);margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;direction:ltr;margin-top:8px}
.grid .h{font-size:.7rem;color:var(--mut);text-align:center}
.ch{aspect-ratio:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:1.5rem;padding:0}
.ch.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
.big{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center;margin-top:10px}
.big .a{font-size:4.2rem;line-height:1.1}
.big .l{font-size:1.3rem;font-weight:600}
.big .r{font-size:1.6rem;direction:rtl}
.btn{background:var(--ac);color:#fff;border:0;border-radius:999px;padding:10px 20px;font:inherit;margin-top:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:8px}
.row .am{font-size:1.5rem;min-width:84px}
.row .m{flex:1;direction:rtl;text-align:right}
.row .m small{display:block;color:var(--mut);direction:ltr;text-align:right}
.sp{border:0;background:var(--ac2);color:var(--ac);border-radius:50%;width:40px;height:40px;font-size:1.1rem}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.q{text-align:center;margin-top:12px}
.q .a{font-size:5rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:1.3rem}
.opts .ok{background:var(--ac);color:#fff}.opts .no{background:var(--bad);color:#fff}
.sc{color:var(--mut);margin-top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem}.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style>
</head>
